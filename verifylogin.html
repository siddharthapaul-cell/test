<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity — LycheMD</title>
    <meta name="description"
        content="Enter your 6-digit secure code to verify your identity and access your LycheMD member portal.">
    <meta name="theme-color" content="#ebf5ff">

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="Assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/images/apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="manifest" href="site.webmanifest">

    <!-- Google Fonts: Plus Jakarta Sans, DM Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="Assets/css/style.css?v=3.2">
</head>

<body class="auth-body">

    <!-- Minimal Brand Header with Trustpilot Rating -->
    <header class="intake-header" aria-label="LycheMD Header">
        <div class="container">
            <div class="intake-header-inner">
                <a href="index.html" class="intake-brand" aria-label="LycheMD Home">
                    <span class="intake-brand-title">LycheMD</span>
                </a>
                <div class="intake-trust-badge" aria-label="Trustpilot Rating: Excellent 4.7 out of 5 stars">
                    <span class="intake-trust-score">Excellent 4.7</span>
                    <div class="intake-trust-stars" aria-hidden="true">
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Verification Content Area -->
    <main class="auth-main" id="mainContent">
        <div class="container auth-container">
            <div class="auth-card">
                <!-- Security Shield Badge Icon -->
                <div class="auth-icon-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <polyline points="9 12 11 14 15 10" />
                    </svg>
                </div>

                <h1 class="auth-title">Verify Your Identity</h1>
                <p class="auth-subtitle">
                    We've sent a 6-digit verification code to
                    <strong id="verifyEmailDisplay" style="color: #17252d; font-weight: 600;">your email</strong>.
                    Enter the code below to complete sign in.
                </p>

                <form id="verifyForm" novalidate>
                    <!-- 6-digit OTP Inputs Grid -->
                    <div class="otp-inputs-grid" role="group" aria-label="6-Digit Verification Code">
                        <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" pattern="[0-9]"
                            data-index="0" aria-label="Digit 1" autofocus required>
                        <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" pattern="[0-9]"
                            data-index="1" aria-label="Digit 2" required>
                        <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" pattern="[0-9]"
                            data-index="2" aria-label="Digit 3" required>
                        <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" pattern="[0-9]"
                            data-index="3" aria-label="Digit 4" required>
                        <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" pattern="[0-9]"
                            data-index="4" aria-label="Digit 5" required>
                        <input type="text" class="otp-digit" inputmode="numeric" maxlength="1" pattern="[0-9]"
                            data-index="5" aria-label="Digit 6" required>
                    </div>

                    <!-- Resend Code Timer -->
                    <div class="auth-resend-row">
                        Didn't receive the code?
                        <button type="button" class="btn-auth-resend" id="btnResend" disabled>
                            Resend in <span id="resendCountdown">45</span>s
                        </button>
                    </div>

                    <!-- Primary Action Button -->
                    <button type="submit" class="btn-auth-primary" id="btnSubmitVerify">
                        Verify &amp; Sign In
                    </button>

                    <!-- Back to Login Link -->
                    <div class="text-center mt-4">
                        <a href="login.html" class="auth-link">← Back to Member Sign In</a>
                    </div>
                </form>

                <!-- HIPAA / Security Badge -->
                <div class="auth-security-badge" aria-label="Security Notice">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <span>256-bit SSL encrypted • HIPAA compliant clinical portal</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="Assets/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP 3 & Plugins -->
    <script src="Assets/js/gsap.min.js"></script>
    <script src="Assets/js/ScrollTrigger.min.js"></script>
    <script src="Assets/js/ScrollToPlugin.min.js"></script>

    <!-- Lenis Smooth Scroll -->
    <script src="Assets/js/lenis.min.js"></script>

    <!-- LycheMD Interactive Main Script -->
    <script src="Assets/js/main.js"></script>

    <!-- Interactive OTP & Verification Logic -->
    <script>
        (function () {
            // Read query params for user email
            const params = new URLSearchParams(window.location.search);
            const userEmail = params.get('email');
            const emailDisplay = document.getElementById('verifyEmailDisplay');
            if (userEmail && emailDisplay) {
                emailDisplay.textContent = userEmail;
            }

            // OTP Inputs auto-advance and backspace handling
            const otpInputs = document.querySelectorAll('.otp-digit');

            otpInputs.forEach((input, idx) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (val.length > 0) {
                        // Take only the last digit if multiple were entered
                        e.target.value = val[val.length - 1];
                        e.target.classList.add('filled');
                        if (idx < otpInputs.length - 1) {
                            otpInputs[idx + 1].focus();
                        }
                    } else {
                        e.target.classList.remove('filled');
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && idx > 0) {
                        otpInputs[idx - 1].focus();
                    }
                });

                // Paste support (e.g. copying 6 digits from email)
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
                    const digits = pasteData.replace(/\D/g, '').slice(0, 6);
                    if (digits) {
                        digits.split('').forEach((d, i) => {
                            if (otpInputs[i]) {
                                otpInputs[i].value = d;
                                otpInputs[i].classList.add('filled');
                            }
                        });
                        const nextFocus = Math.min(digits.length, otpInputs.length - 1);
                        otpInputs[nextFocus].focus();
                    }
                });
            });

            // Resend Countdown Timer
            let timeLeft = 45;
            const resendBtn = document.getElementById('btnResend');
            const countdownEl = document.getElementById('resendCountdown');

            const timer = setInterval(() => {
                timeLeft--;
                if (countdownEl) countdownEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (resendBtn) {
                        resendBtn.disabled = false;
                        resendBtn.textContent = 'Resend Code Now';
                    }
                }
            }, 1000);

            if (resendBtn) {
                resendBtn.addEventListener('click', () => {
                    resendBtn.disabled = true;
                    timeLeft = 45;
                    resendBtn.innerHTML = 'Resend in <span id="resendCountdown">45</span>s';
                    alert('A new 6-digit secure code has been sent to your email.');
                });
            }

            // Verify Submission
            const verifyForm = document.getElementById('verifyForm');
            const submitBtn = document.getElementById('btnSubmitVerify');

            if (verifyForm) {
                verifyForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    let code = '';
                    otpInputs.forEach(i => code += i.value);

                    if (code.length < 6) {
                        // Pre-fill demo digits if empty for instant easy testing
                        otpInputs.forEach((inp, i) => {
                            if (!inp.value) inp.value = (i + 1).toString();
                            inp.classList.add('filled');
                        });
                    }

                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span>Verifying...</span>';
                    }

                    setTimeout(() => {
                        if (submitBtn) {
                            submitBtn.style.backgroundColor = '#16a34a';
                            submitBtn.innerHTML = '✓ Success! Entering Portal...';
                        }
                        setTimeout(() => {
                            window.location.href = 'order-confirmation.html';
                        }, 700);
                    }, 600);
                });
            }
        })();
    </script>
</body>

</html>
