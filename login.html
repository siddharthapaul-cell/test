<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Sign In — LycheMD</title>
    <meta name="description"
        content="Sign in to your secure LycheMD member portal to access your prescriptions, clinician messages, and orders.">
    <meta name="theme-color" content="#ebf5ff">

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="Assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/images/apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="manifest" href="site.webmanifest">

    <!-- Google Fonts: Plus Jakarta Sans, DM Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="Assets/css/style.css?v=3.2">
</head>

<body class="auth-body">

    <!-- Minimal Brand Header with Trustpilot Rating -->
    <header class="intake-header" aria-label="LycheMD Header">
        <div class="container">
            <div class="intake-header-inner">
                <a href="index.html" class="intake-brand" aria-label="LycheMD Home">
                    <span class="intake-brand-title">LycheMD</span>
                </a>
                <div class="intake-trust-badge" aria-label="Trustpilot Rating: Excellent 4.7 out of 5 stars">
                    <span class="intake-trust-score">Excellent 4.7</span>
                    <div class="intake-trust-stars" aria-hidden="true">
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                        <span class="tp-star-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Login Content Area -->
    <main class="auth-main" id="mainContent">
        <div class="container auth-container">
            <div class="auth-card">
                <!-- User Avatar Badge Icon -->
                <div class="auth-icon-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>

                <h1 class="auth-title">Member Sign In</h1>
                <p class="auth-subtitle">
                    Enter your email to access your treatment plan, provider messages, and order history.
                </p>

                <form action="verifylogin.html" method="GET" id="loginForm" novalidate>
                    <!-- Email Address -->
                    <div class="auth-form-group">
                        <label for="userEmail" class="auth-label">Email Address</label>
                        <div class="auth-input-wrap">
                            <input type="email" id="userEmail" name="email" class="auth-input"
                                placeholder="name@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-form-group" id="pwdGroup">
                        <label for="userPassword" class="auth-label">Password</label>
                        <div class="auth-input-wrap">
                            <input type="password" id="userPassword" name="password" class="auth-input"
                                placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="auth-toggle-pwd" id="togglePassword"
                                aria-label="Toggle password visibility">
                                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Device & Forgot Password -->
                    <div class="auth-options-row">
                        <label class="auth-checkbox-label">
                            <input type="checkbox" class="auth-checkbox" name="remember" checked>
                            <span>Remember this device</span>
                        </label>
                        <a href="verifylogin.html" class="auth-link" id="linkForgotPassword">Forgot password?</a>
                    </div>

                    <!-- Primary Action Button -->
                    <button type="submit" class="btn-auth-primary" id="btnSubmitLogin">
                        Sign In
                    </button>

                    <!-- Divider -->
                    <div class="auth-divider">
                        <span>or</span>
                    </div>

                    <!-- Passwordless One-Time Code Option -->
                    <a href="verifylogin.html" class="btn-auth-secondary" id="btnOneTimeCode">
                        Sign In with One-Time Code
                    </a>
                </form>

                <!-- Footer Prompt -->
                <div class="auth-footer-prompt">
                    Don't have a LycheMD account?
                    <a href="intake.html" class="auth-link">Start eligibility quiz →</a>
                </div>

                <!-- HIPAA / Security Badge -->
                <div class="auth-security-badge" aria-label="Security Notice">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <span>256-bit SSL encrypted • HIPAA compliant clinical portal</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="Assets/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP 3 & Plugins -->
    <script src="Assets/js/gsap.min.js"></script>
    <script src="Assets/js/ScrollTrigger.min.js"></script>
    <script src="Assets/js/ScrollToPlugin.min.js"></script>

    <!-- Lenis Smooth Scroll -->
    <script src="Assets/js/lenis.min.js"></script>

    <!-- LycheMD Interactive Main Script -->
    <script src="Assets/js/main.js"></script>

    <!-- Interactive Helpers -->
    <script>
        (function () {
            // Password Visibility Toggle
            const toggleBtn = document.getElementById('togglePassword');
            const pwdInput = document.getElementById('userPassword');
            const eyeIcon = document.getElementById('eyeIcon');

            if (toggleBtn && pwdInput) {
                toggleBtn.addEventListener('click', function () {
                    const isPwd = pwdInput.type === 'password';
                    pwdInput.type = isPwd ? 'text' : 'password';
                    if (isPwd) {
                        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
                    } else {
                        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
                    }
                });
            }

            // Sync email to One-time code link
            const emailInput = document.getElementById('userEmail');
            const oneTimeLink = document.getElementById('btnOneTimeCode');
            const forgotLink = document.getElementById('linkForgotPassword');

            function updateVerifyLinks() {
                const val = emailInput ? encodeURIComponent(emailInput.value.trim()) : '';
                const query = val ? '?email=' + val : '';
                if (oneTimeLink) oneTimeLink.href = 'verifylogin.html' + query;
                if (forgotLink) forgotLink.href = 'verifylogin.html' + query;
            }

            if (emailInput) {
                emailInput.addEventListener('input', updateVerifyLinks);
            }

            // Form Submit: Navigate to verifylogin.html with email query
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const emailVal = emailInput ? emailInput.value.trim() : '';
                    if (!emailVal) {
                        emailInput.focus();
                        return;
                    }
                    window.location.href = 'verifylogin.html?email=' + encodeURIComponent(emailVal);
                });
            }
        })();
    </script>
</body>

</html>
